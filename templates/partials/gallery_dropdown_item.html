{% if node.children %}
<li class="dropdown">
  <a href="{{ node.page.get_absolute_url }}"><span>{{ node.page.title }}</span> <i class="bi bi-chevron-down toggle-dropdown"></i></a>
  <ul>
    {% for child in node.children %}
      {% include 'partials/gallery_dropdown_item.html' with node=child %}
    {% endfor %}
  </ul>
</li>
{% else %}
<li><a href="{{ node.page.get_absolute_url }}">{{ node.page.title }}</a></li>
{% endif %}
