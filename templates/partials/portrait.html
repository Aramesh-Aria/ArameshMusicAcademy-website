{% load site_tags %}{# A teacher's 1:1 portrait. A missing or broken upload becomes the initials on a stone plate (see base.html). #}
{% if teacher.profile_image %}
<img class="portrait{% if class %} {{ class }}{% endif %}" src="{{ teacher.profile_image.url }}" {% srcset teacher.profile_image sizes|default:"(min-width: 37.5em) 350px, 60vw" %} width="600" height="600" alt="{{ teacher.full_name }}" decoding="async"{% if lazy %} loading="lazy"{% endif %} data-initials="{{ teacher.first_name|slice:':1' }} {{ teacher.last_name|slice:':1' }}">
{% else %}
<span class="portrait portrait-initials{% if class %} {{ class }}{% endif %}" role="img" aria-label="{{ teacher.full_name }}">{{ teacher.first_name|slice:':1' }} {{ teacher.last_name|slice:':1' }}</span>
{% endif %}
