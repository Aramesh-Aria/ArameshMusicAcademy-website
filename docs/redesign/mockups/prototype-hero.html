<!doctype html>
<!--
  PROTOTYPE, throwaway. Redesign brief step 6: four home-hero variants for Aramesh Music Academy,
  switchable with the picker at the bottom (keys 1–4, ← →, R to replay).
  Photos and titles are the seed's `home-hero` gallery page; copy is gate-1-models-and-copy.md §3.1.
  «امروز در آموزشگاه» is computed live from the real ClassSessions (post-migration names) in Tehran time.
  Buttons use the Plain variant from prototype-buttons.html as a neutral stand-in; Gate 2 picks both.
  Sahel loads from jsDelivr for the prototype only; production self-hosts subset woff2.
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/logo-saffron.png">
<title>Prototype: home hero</title>
<style>
@font-face { font-family: "Sahel"; font-weight: 400; font-display: swap;
  src: url(https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/Sahel.woff2) format("woff2"); }
@font-face { font-family: "Sahel"; font-weight: 700; font-display: swap;
  src: url(https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/Sahel-Bold.woff2) format("woff2"); }
@font-face { font-family: "Amiri"; font-weight: 700; font-display: swap;
  src: url(../../../public/static/assets/fonts/amiri-fa-700.woff2) format("woff2"); }

:root {
  --ground: #17130f; --stone: #ebe5dc; --ink: #17130f; --saffron: #e2a72e;
  --soft: rgba(235, 229, 220, 0.74);
  --raised: #211b16;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --pad: clamp(12px, 1.7vw, 24px);
  --r-panel: 28px;
  --slide: 6500ms;
  --fade: 1200ms;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground); color: var(--stone);
  font-family: "Sahel", system-ui, sans-serif; font-size: 19px; line-height: 1.75;
  -webkit-font-smoothing: antialiased; overflow-x: clip;
}
img { display: block; max-width: 100%; }
bdi.num { direction: ltr; unicode-bidi: isolate; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ── Buttons: the Plain variant, as a stand-in ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 50px; padding: 0 24px; border: 0; border-radius: 999px;
  font: 700 17px/1 "Sahel", system-ui, sans-serif; text-decoration: none; white-space: nowrap; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform 160ms var(--ease-out), background-color 150ms ease-out;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:active { transform: scale(0.97); }
.btn:focus-visible { outline: 2px solid var(--saffron); outline-offset: 3px; }
.btn--primary { background: var(--saffron); color: var(--ink); }
.btn--secondary { background: var(--stone); color: var(--ink); }
.btn--sm { height: 46px; padding: 0 20px; font-size: 16px; }
@media (hover: hover) and (pointer: fine) {
  .btn--primary:hover { background: #ecb646; }
  .btn--secondary:hover { background: #f6f2ec; }
}

/* ── Page scaffold ── */
.page { padding: var(--pad); display: grid; gap: var(--pad); }
.nav { display: flex; align-items: center; gap: 28px; padding: 8px; padding-inline-start: 22px; border-radius: 999px; }
.nav-logo { height: 40px; width: auto; }
.nav-links { display: flex; gap: 26px; margin-inline-start: auto; font-size: 17px; }
.nav-links a { color: var(--stone); text-decoration: none; }
.nav-menu { display: none; }
.next-panel { border-radius: var(--r-panel); background: var(--stone); color: var(--ink); padding: clamp(24px, 3.4vw, 52px); min-height: 280px; }
.next-panel h2 { font-family: "Amiri", serif; font-size: clamp(32px, 3vw, 44px); line-height: 1.2; margin: 0 0 10px; }
.next-panel p { margin: 0; max-width: 60ch; }

/* ── Shared hero parts ── */
.hero { position: relative; }
.frame { position: relative; overflow: hidden; border-radius: var(--r-panel); background: var(--raised); isolation: isolate; }
.slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
  transition: opacity var(--fade) cubic-bezier(0.45, 0, 0.55, 1); }
.slide[data-on] { opacity: 1; }
.scrim { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.copy { position: relative; z-index: 3; }
.copy h1 { font-family: "Amiri", serif; font-weight: 700; font-size: clamp(44px, 5vw, 78px); line-height: 1.2; margin: 0 0 14px; text-wrap: balance; }
.copy .lede { margin: 0 0 28px; max-width: 54ch; color: var(--soft); }
.actions { display: flex; flex-wrap: wrap; gap: 12px 14px; }

/* The slide title: all four stacked in one cell; the active one fades in. */
.titles { display: grid; margin: 0 0 6px; font-weight: 700; font-size: 15px; color: var(--saffron); }
.titles > span { grid-area: 1 / 1; opacity: 0; transition: opacity 400ms ease-out; }
.titles > span[data-on] { opacity: 1; transition-delay: 300ms; }

/* Progress bars double as the clock: each slide lasts as long as its bar's fill animation. */
.bars { display: flex; gap: 6px; }
.bar { width: 28px; height: 3px; border-radius: 999px; background: rgba(235, 229, 220, 0.28); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--stone); transform: scaleX(0); transform-origin: right; }
.bar[data-done] i { transform: scaleX(1); }
.bar[data-on] i { animation: fill var(--slide) linear forwards; }
.hero[data-paused] .bar[data-on] i { animation-play-state: paused; }
@keyframes fill { to { transform: scaleX(1); } }

.today { display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.5; }
.today a { color: inherit; text-decoration: none; }
.today b { color: var(--saffron); font-weight: 700; }
.today .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); flex: none; }

/* ════ 1 · قاب (Frame): full-height frame, copy on the photo at the start, today strip in the far corner ════ */
.v-frame .frame { min-height: min(780px, calc(100svh - 110px)); display: grid; align-items: end; }
.v-frame .scrim { background: linear-gradient(to left, rgba(23,19,15,.82) 0%, rgba(23,19,15,.55) 38%, rgba(23,19,15,0) 68%),
  linear-gradient(to top, rgba(23,19,15,.6), rgba(23,19,15,0) 45%); }
.v-frame .copy { padding: clamp(28px, 4vw, 64px); max-width: 760px; }
.v-frame .corner { position: absolute; z-index: 3; inset-inline-end: 24px; bottom: 24px; display: grid; gap: 12px; justify-items: end; }
.v-frame .today { background: var(--ground); padding: 10px 18px; border-radius: 999px; }

/* ════ 2 · دوپاره (Split): copy on the ground, the photo in its own frame; the photo drifts while shown ════ */
.v-split .hero { display: grid; grid-template-columns: 5fr 7fr; gap: var(--pad); min-height: min(780px, calc(100svh - 110px)); }
.v-split .copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(24px, 3vw, 48px) clamp(8px, 2vw, 32px); }
.v-split .copy h1 { font-size: clamp(44px, 4.6vw, 72px); }
.v-split .slide { transform: scale(1.06); transition: opacity var(--fade) cubic-bezier(0.45, 0, 0.55, 1), transform 0ms linear var(--fade); }
.v-split .slide[data-on] { transform: scale(1); transition: opacity var(--fade) cubic-bezier(0.45, 0, 0.55, 1), transform calc(var(--slide) + var(--fade)) cubic-bezier(0.2, 0, 0.3, 1); }
.v-split .hero[data-paused] .slide[data-on] { transition-property: opacity; }
.v-split .scrim { background: linear-gradient(to top, rgba(23,19,15,.7), rgba(23,19,15,0) 30%); }
.v-split .caption { position: absolute; z-index: 3; inset-inline-start: 24px; inset-inline-end: 24px; bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.v-split .caption .titles { margin: 0; color: var(--stone); font-size: 16px; }
.v-split .today { margin-top: 32px; padding: 14px 20px; background: var(--raised); border-radius: 20px; }

/* ════ 3 · فهرست (Index): the four titles are a visible, clickable index of the rooms ════ */
.v-index .frame { min-height: min(780px, calc(100svh - 110px)); display: grid; grid-template-columns: 1fr auto; align-items: end; }
.v-index .scrim { background: linear-gradient(to top, rgba(23,19,15,.85) 0%, rgba(23,19,15,.45) 45%, rgba(23,19,15,0) 72%); }
.v-index .copy { padding: clamp(28px, 4vw, 64px); max-width: 780px; }
.v-index .side { position: relative; z-index: 3; padding: clamp(28px, 4vw, 64px); padding-inline-start: 0; display: grid; gap: 18px; justify-items: end; align-self: end; }
.v-index .index { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; min-width: 230px; }
.v-index .index button {
  all: unset; box-sizing: border-box; position: relative; display: block; width: 100%; padding: 10px 0 12px; cursor: pointer;
  font-size: 16px; color: rgba(235, 229, 220, 0.6); transition: color 150ms ease-out;
}
.v-index .index button:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; border-radius: 4px; }
.v-index .index button[aria-current] { color: var(--stone); font-weight: 700; }
@media (hover: hover) and (pointer: fine) { .v-index .index button:hover { color: var(--stone); } }
.v-index .index .bar { position: absolute; inset: auto 0 0; width: auto; height: 2px; }
.v-index .index .bar i { background: var(--saffron); }
.v-index .today { background: var(--ground); padding: 10px 18px; border-radius: 999px; }

/* ════ 4 · پرده (Curtain): one wide caption row; slides are drawn across, right to left, like a curtain ════ */
.v-curtain .frame { min-height: min(780px, calc(100svh - 110px)); display: grid; align-items: end; }
.v-curtain .slide { opacity: 1; transition: none; clip-path: inset(0 0 0 100%); z-index: 0; }
.v-curtain .slide[data-was] { clip-path: inset(0); z-index: 0; }
.v-curtain .slide[data-on] { clip-path: inset(0); z-index: 1; animation: draw 1100ms cubic-bezier(0.65, 0, 0.35, 1); }
.v-curtain .slide[data-still] { animation: none; }
@keyframes draw { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0); } }
.v-curtain .scrim { background: linear-gradient(to top, rgba(23,19,15,.9) 0%, rgba(23,19,15,.6) 34%, rgba(23,19,15,0) 62%); }
.v-curtain .copy { padding: clamp(28px, 4vw, 56px); display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px 48px; }
.v-curtain .copy h1 { margin: 0; }
.v-curtain .copy .lede { margin: 12px 0 0; }
.v-curtain .actions { justify-content: flex-end; }
.v-curtain .top { position: absolute; z-index: 3; inset-inline-end: 24px; top: 24px; display: flex; gap: 14px; align-items: center; }
.v-curtain .today { background: var(--ground); padding: 10px 18px; border-radius: 999px; }

@media (prefers-reduced-motion: reduce) {
  .slide, .titles > span { transition: none !important; }
  .v-split .slide, .v-split .slide[data-on] { transform: none; }
  .v-curtain .slide[data-on] { animation: none; }
  .bars, .bar { display: none; }
  .v-index .index .bar { display: none; }
}

/* ── Phone ── */
@media (max-width: 760px) {
  :root { --r-panel: 20px; }
  .nav { padding-inline-start: 16px; gap: 10px; }
  .nav-links { display: none; }
  .nav-menu { display: inline-flex; margin-inline-start: auto; }
  .nav .nav-call .label { display: none; }
  .nav .nav-call { width: 46px; padding: 0; }
  .copy h1 { font-size: 42px; }
  .copy .lede { font-size: 17px; }
  .actions .btn { flex: 1 1 100%; }
  .today { font-size: 15px; }
  .today-out { display: flex; background: var(--raised); border-radius: 20px; padding: 14px 18px; }

  .v-frame .frame, .v-index .frame, .v-curtain .frame { min-height: 700px; }
  .v-frame .scrim, .v-index .scrim, .v-curtain .scrim { background: linear-gradient(to top, rgba(23,19,15,.94) 0%, rgba(23,19,15,.82) 58%, rgba(23,19,15,0) 85%); }
  .v-frame .copy, .v-index .copy { padding: 24px 20px; }
  .v-frame .corner { inset-inline-end: auto; inset-inline-start: 20px; top: 20px; bottom: auto; }
  .v-frame .corner .today, .v-index .side .today, .v-curtain .top .today { display: none; }

  .v-split .hero { grid-template-columns: 1fr; min-height: 0; }
  .v-split .frame { order: -1; aspect-ratio: 4 / 5; }
  .v-split .copy { padding: 8px 8px 0; }
  .v-split .copy .today { display: none; }

  .v-index .frame { grid-template-columns: 1fr; align-content: end; }
  .v-index .side { order: -1; padding: 20px 20px 0; justify-items: stretch; }
  .v-index .index { grid-auto-flow: column; grid-auto-columns: max-content; gap: 18px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
  .v-index .index button { font-size: 15px; }

  .v-curtain .copy { grid-template-columns: 1fr; padding: 24px 20px; }
  .v-curtain .actions { justify-content: stretch; }
}
@media (min-width: 761px) { .today-out { display: none; } }

/* ════ Picker (verbatim from emil-prototype/PICKER.md) ════ */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}
.proto-picker-item:active {
  transform: scale(0.97);
}
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] {
  color: #fff;
}
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}
.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants" dir="ltr">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Frame</button>
  <button class="proto-picker-item">Split</button>
  <button class="proto-picker-item">Index</button>
  <button class="proto-picker-item">Curtain</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
// The seed's home-hero gallery page, in order, with each photo's admin title.
const SLIDES = [
  ['img/hero-1.jpg', 'کلاس سنتور', '50% 78%'],
  ['img/hero-2.jpg', 'صدا سازی و آواز کلاسیک', '50% 40%'],
  ['img/hero-3.jpg', 'کلاس پیانو', '50% 50%'],
  ['img/hero-4.jpg', 'کلاس تار و سه تار', '50% 35%'],
];

// Real ClassSessions after the step-7 migration: [weekday Sat=0, start, end, what is taught].
// Masoud Aramesh's Thursday is reserved for گروه نوازی; Nasim Haghi teaches the موسیقی کودک Programme.
const SESSIONS = [
  ...[0, 1, 2, 3].map((d) => [d, '12:00', '21:00', ['سنتور']]),
  [5, '10:00', '19:00', ['گروه نوازی']],
  [0, '16:00', '21:00', ['پیانو']], [2, '14:00', '21:00', ['پیانو']],
  [4, '14:00', '21:00', ['تار', 'سه تار']],
  [0, '14:00', '21:00', ['آواز ایرانی']],
  [2, '13:00', '20:30', ['تنبک', 'داربوکا', 'دف', 'هنگدرام', 'کاخن']],
  [3, '14:00', '21:00', ['تنبک', 'دف', 'هنگدرام']],
  [3, '14:00', '21:00', ['پیانو']],
  [0, '14:00', '21:00', ['موسیقی کودک']],
  [3, '14:00', '23:00', ['ویولن']],
  [4, '14:00', '23:00', ['پیانو', 'گیتار الکتریک', 'گیتار پاپ']],
  [2, '14:00', '21:00', ['گیتار پاپ']],
];
const DAYS = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
const fa = (s) => String(s).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
const hm = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const clock = (min) => fa(min % 60 ? `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}` : Math.floor(min / 60));

function todayLine() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', { weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23', timeZone: 'Asia/Tehran' })
    .formatToParts(new Date()).map((p) => [p.type, p.value]));
  const day = ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'].indexOf(parts.weekday);
  const now = +parts.hour * 60 + +parts.minute;
  const of = (d) => SESSIONS.filter((s) => s[0] === d);
  const today = of(day);
  const end = Math.max(0, ...today.map((s) => hm(s[2])));
  if (today.length && now < end) {
    const taught = [...new Set(today.flatMap((s) => s[3]))];
    const shown = taught.length > 5 ? taught.slice(0, 4).join('، ') + ' و …' : taught.join('، ');
    return `<b>امروز، ${DAYS[day]}:</b> ${shown} · تا ساعت ${clock(end)}`;
  }
  let d = (day + 1) % 7; while (!of(d).length) d = (d + 1) % 7;
  const open = Math.min(...of(d).map((s) => hm(s[1])));
  if (day === 6) return `<b>جمعه‌ها آموزشگاه تعطیل است.</b> ${DAYS[d]} از ساعت ${clock(open)} پاسخگوی شما هستیم.`;
  return `<b>کلاس‌های امروز تمام شده.</b> ${d === (day + 1) % 7 ? 'فردا' : DAYS[d]} از ساعت ${clock(open)}.`;
}

const ICON = {
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
};
const slidesHTML = () => SLIDES.map(([src, title, pos], i) =>
  `<img class="slide" src="${src}" alt="${title}" style="object-position:${pos}"${i ? ' loading="lazy"' : ' fetchpriority="high" data-on'}>`).join('');
const titlesHTML = () => `<p class="titles" aria-hidden="true">${SLIDES.map(([, t], i) => `<span${i ? '' : ' data-on'}>${t}</span>`).join('')}</p>`;
const barsHTML = () => `<div class="bars" aria-hidden="true">${SLIDES.map((_, i) => `<span class="bar"${i ? '' : ' data-on'}><i></i></span>`).join('')}</div>`;
const todayHTML = (cls = '') => `<p class="today ${cls}"><span class="dot" aria-hidden="true"></span><a href="#schedule">${todayLine()}</a></p>`;
const copyHTML = (withTitles = true) => `
  ${withTitles ? titlesHTML() : ''}
  <h1>موسیقی، در فضایی آرام</h1>
  <p class="lede">آموزش خصوصی سنتور، تار، پیانو، ویولن، آواز و سازهای دیگر برای کودکان، نوجوانان و بزرگسالان، با مدیریت مسعود آرامش، آهنگساز و نوازندهٔ سنتور.</p>`;
const actionsHTML = () => `<div class="actions">
  <a class="btn btn--primary" href="tel:+982144457748">${ICON.phone}<span>تماس با آموزشگاه</span></a>
  <a class="btn btn--secondary" href="#programmes"><span>دوره‌ها</span>${ICON.arrow}</a></div>`;

const HERO = {
  frame: () => `
    <section class="hero" aria-label="معرفی آموزشگاه">
      <div class="frame">${slidesHTML()}<div class="scrim"></div>
        <div class="copy">${copyHTML()}${actionsHTML()}</div>
        <div class="corner">${barsHTML()}${todayHTML()}</div>
      </div>
    </section>${todayHTML('today-out')}`,
  split: () => `
    <section class="hero" aria-label="معرفی آموزشگاه">
      <div class="copy">${copyHTML(false)}${actionsHTML()}${todayHTML()}</div>
      <div class="frame">${slidesHTML()}<div class="scrim"></div>
        <div class="caption">${titlesHTML()}${barsHTML()}</div>
      </div>
    </section>${todayHTML('today-out')}`,
  index: () => `
    <section class="hero" aria-label="معرفی آموزشگاه">
      <div class="frame">${slidesHTML()}<div class="scrim"></div>
        <div class="copy">${copyHTML(false)}${actionsHTML()}</div>
        <div class="side">
          <ol class="index" aria-label="عکس‌های آموزشگاه">${SLIDES.map(([, t], i) =>
            `<li><button type="button" data-go="${i}"${i ? '' : ' aria-current="true"'}>${t}<span class="bar"${i ? '' : ' data-on'}><i></i></span></button></li>`).join('')}</ol>
          ${todayHTML()}
        </div>
      </div>
    </section>${todayHTML('today-out')}`,
  curtain: () => `
    <section class="hero" aria-label="معرفی آموزشگاه">
      <div class="frame">${slidesHTML()}<div class="scrim"></div>
        <div class="top">${todayHTML()}${barsHTML()}</div>
        <div class="copy"><div>${copyHTML()}</div>${actionsHTML()}</div>
      </div>
    </section>${todayHTML('today-out')}`,
};

function scene(v) {
  return `
  <div class="page v-${v}">
    <header class="nav">
      <img class="nav-logo" src="img/logo-saffron.png" alt="آموزشگاه موسیقی آرامش">
      <nav class="nav-links" aria-label="اصلی"><a href="#">درباره ما</a><a href="#">دوره‌ها</a><a href="#">اساتید</a><a href="#">برنامه کلاس‌ها</a><a href="#">گالری</a></nav>
      <span class="nav-menu"><a class="btn btn--secondary btn--sm" href="#">منو</a></span>
      <a class="btn btn--primary btn--sm nav-call" href="tel:+982144457748">${ICON.phone}<span class="label">تماس <bdi class="num">۰۲۱ ۴۴۴۵ ۷۷۴۸</bdi></span></a>
    </header>
    ${HERO[v]()}
    <section class="next-panel" id="programmes"><h2>آموزشگاه موسیقی آرامش</h2><p>بخش بعدی صفحه (پنل درباره ما) اینجا می‌آید، تا ارتفاع و فاصلهٔ هیرو در کنار همسایه‌اش دیده شود.</p></section>
    <div style="height:80px"></div>
  </div>`;
}

// ── Slideshow: advances when the active bar finishes filling; pauses on hover, focus, off-screen and hidden tab ──
let teardown = () => {};
function initHero() {
  teardown();
  const hero = document.querySelector('.hero'); if (!hero) return;
  const slides = [...hero.querySelectorAll('.slide')];
  const titles = [...hero.querySelectorAll('.titles > span')];
  const bars = [...hero.querySelectorAll('.bar')];
  const idx = [...hero.querySelectorAll('[data-go]')];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0;
  const reasons = new Set();
  const sync = () => hero.toggleAttribute('data-paused', reasons.size > 0);
  const pause = (r) => { reasons.add(r); sync(); };
  const resume = (r) => { reasons.delete(r); sync(); };

  function go(n, user = false) {
    const prev = i; i = (n + slides.length) % slides.length;
    slides.forEach((s, k) => {
      s.toggleAttribute('data-was', k === prev && k !== i);
      s.toggleAttribute('data-on', k === i);
      s.toggleAttribute('data-still', still);
    });
    titles.forEach((t, k) => t.toggleAttribute('data-on', k === i));
    bars.forEach((b, k) => {
      b.removeAttribute('data-on'); b.toggleAttribute('data-done', k < i);
      // Restart the fill animation on the new active bar.
      if (k === i) { void b.offsetWidth; b.setAttribute('data-on', ''); }
    });
    idx.forEach((b, k) => k === i ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current'));
  }
  const onEnd = (e) => { if (e.animationName === 'fill' && !still) go(i + 1); };
  hero.addEventListener('animationend', onEnd);
  idx.forEach((b, k) => b.addEventListener('click', () => go(k, true)));

  const enter = () => pause('hover'), leave = () => resume('hover');
  const fin = () => pause('focus'), fout = () => { if (!hero.contains(document.activeElement)) resume('focus'); };
  hero.addEventListener('pointerenter', enter); hero.addEventListener('pointerleave', leave);
  hero.addEventListener('focusin', fin); hero.addEventListener('focusout', () => setTimeout(fout));
  const io = new IntersectionObserver(([e]) => e.isIntersecting ? resume('offscreen') : pause('offscreen'), { threshold: 0.25 });
  io.observe(hero);
  const vis = () => document.hidden ? pause('hidden') : resume('hidden');
  document.addEventListener('visibilitychange', vis);
  if (still) pause('reduced');
  window.__hero = { go, get i() { return i; }, get paused() { return [...reasons]; } };
  teardown = () => { io.disconnect(); document.removeEventListener('visibilitychange', vis); };
}

const variants = ['frame', 'split', 'index', 'curtain'].map((v) => () => scene(v));

// ── Picker wiring (verbatim from PICKER.md, plus initHero() after each mount) ──
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); initHero(); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
